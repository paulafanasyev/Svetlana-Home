name: SvetlanaHome CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ─── Development gate ───────────────────────────────────────────
  # Мягкий: допусняет fallthrough, чтобы разработка не блокировалась.
  build:
    name: Dev gate — Lint + Unit + APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # На hosted-раннере Ubuntu Android SDK 36 и build-tools уже предустановлены.
      # android-actions/setup-android@v3 здесь не используется: он пытается установить
      # устаревший пакет tools, которого больше нет в cmdline-tools 16.0.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Gradle memory
        # lintAnalyzeDebug требует много heap на x86_64; без этого daemon
        # падает с JVM crash на hosted-раннере.
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Compute APK checksum
        id: checksum
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/apk.sha256
          echo "sha256=$(cut -d' ' -f1 < app/build/outputs/apk/debug/apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: svetlana-home-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/apk.sha256
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # ─── Instrumentation (emulator) ────────────────────────────────
  # Эмулятор НЕ заменяет тестирование на физическом устройстве (ТЗ §77).
  # Запускается как информация; для production-gate не учитывается.
  instrumentation:
    name: Instrumentation tests (emulator, info)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install emulator system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "system-images;android-30;default;x86_64" || true

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest --no-daemon

  # ─── Production gate ──────────────────────────────────────────
  # Жёсткий: все шаги обязательны. Только этот джоб может разрешать
  # релиз (аудит п.2). continue-on-error здесь недопустим.
  production-gate:
    name: Production gate — full verification
    runs-on: ubuntu-latest
    needs: [ build ]
    # Защищаем от случайного игнорирования сбоев.
    # instrumentation намеренно не в needs: эмулятор — информационный шаг
    # и не должен блокировать gate (ТЗ §77: эмулятор ≠ физическое устройство).
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Gradle memory
        # lintAnalyzeDebug требует много heap на x86_64; без этого daemon
        # падает с JVM crash на hosted-раннере.
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Lint (strict)
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests (strict)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Debug APK (strict)
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify no secrets in tree
        run: |
          # ТЗ §78: в репозитории не должно быть секретов.
          # Ловим реальные шаблоны ключей (длина, специфичная для провайдеров).
          # Тестовые строки в HybridPipelineTest намеренно содержат
          # маскируемый пример — это не секрет, а проверка санитизации.
          if grep -rnE "(sk-[A-Za-z0-9]{40,})|(ghp_[A-Za-z0-9]{36})|(AKIA[0-9A-Z]{16})" \
             --exclude-dir=.git --exclude-dir=build --exclude='*.gradle' \
             --exclude='HybridPipelineTest.kt' . ; then
            echo "FOUND_SECRETS" && exit 1
          fi
          echo "no secrets found"

      - name: Report gate result
        run: echo "PRODUCTION_GATE=PASSED"
