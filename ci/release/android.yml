# Скопируйте ВЕСЬ этот файл в .github/workflows/android.yml (заменив старое содержимое).
# Отличие от старого только в джобе publish-release: тег и название релиза берутся из versionName
# (app/build.gradle.kts) вместо зашитого v1.2.1, а APK публикуется с постоянным именем Svetlana-Home-arm64.apk
# (кнопка на сайте: releases/latest/download/Svetlana-Home-arm64.apk).
# Релиз: push тега v* или коммит в main с сообщением ровно "release".
name: SvetlanaHome CI

concurrency:
  group: svetlana-home-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ─── Development gate ─────────────────────────────────────────────
  build:
    name: Dev gate — Lint + Unit + APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew scripts/run_instrumentation.sh

      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Compute APK checksum
        id: checksum
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/apk.sha256
          echo "sha256=$(cut -d' ' -f1 < app/build/outputs/apk/debug/apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: svetlana-home-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/apk.sha256
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # ─── Instrumentation (emulator) ────────────────────────────────
  instrumentation:
    name: Instrumentation tests (emulator)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew scripts/run_instrumentation.sh

      - name: Install emulator system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;default;x86_64"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./scripts/run_instrumentation.sh

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-diagnostics-${{ github.run_id }}
          path: |
            instrumentation-result-*.env
            instrumentation-gradle-*.log
            instrumentation-diagnostics-*.txt
          if-no-files-found: ignore

  # ─── Production gate ──────────────────────────────────────────────
  production-gate:
    name: Production gate — full verification
    runs-on: ubuntu-latest
    needs: [ build, instrumentation ]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew scripts/run_instrumentation.sh

      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Lint (strict)
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests (strict)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Debug APK (strict)
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare release keystore
        env:
          SVETLANA_KEYSTORE_BASE64: ${{ secrets.SVETLANA_KEYSTORE_BASE64 }}
          SVETLANA_STORE_PASSWORD: ${{ secrets.SVETLANA_STORE_PASSWORD }}
          SVETLANA_KEY_ALIAS: ${{ secrets.SVETLANA_KEY_ALIAS }}
          SVETLANA_KEY_PASSWORD: ${{ secrets.SVETLANA_KEY_PASSWORD }}
        run: |
          if [ -z "$SVETLANA_KEYSTORE_BASE64" ] || [ -z "$SVETLANA_STORE_PASSWORD" ] || [ -z "$SVETLANA_KEY_ALIAS" ] || [ -z "$SVETLANA_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are incomplete. Production gate requires a signed release."
            exit 1
          fi
          echo "$SVETLANA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/svetlana-release.jks"
          test -s "$RUNNER_TEMP/svetlana-release.jks"
          echo "SVETLANA_STORE_FILE=$RUNNER_TEMP/svetlana-release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          echo "Release keystore prepared"

      - name: Release APK with R8 (strict)
        env:
          SVETLANA_STORE_FILE: ${{ env.SVETLANA_STORE_FILE }}
          SVETLANA_STORE_PASSWORD: ${{ secrets.SVETLANA_STORE_PASSWORD }}
          SVETLANA_KEY_ALIAS: ${{ secrets.SVETLANA_KEY_ALIAS }}
          SVETLANA_KEY_PASSWORD: ${{ secrets.SVETLANA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Release AAB (strict)
        env:
          SVETLANA_STORE_FILE: ${{ env.SVETLANA_STORE_FILE }}
          SVETLANA_STORE_PASSWORD: ${{ secrets.SVETLANA_STORE_PASSWORD }}
          SVETLANA_KEY_ALIAS: ${{ secrets.SVETLANA_KEY_ALIAS }}
          SVETLANA_KEY_PASSWORD: ${{ secrets.SVETLANA_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify release signature
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner не найден в build-tools" && exit 1
          fi
          if [ "$SIGNING_ENABLED" != "true" ]; then
            echo "::error::Production gate reached signature verification without signing enabled"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK_SIGNATURE=SIGNED (apksigner)"
          if ! jarsigner -verify "$AAB" >/dev/null 2>&1; then
            echo "::error::AAB_SIGNATURE=UNSIGNED or invalid"
            exit 1
          fi
          echo "AAB_SIGNATURE=SIGNED"

      - name: Check 16 KB native library alignment
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          TMP=$(mktemp -d)
          unzip -o -q "$APK" -d "$TMP" 'lib/*' || true
          python3 scripts/check_16kb_alignment.py "$TMP"

      - name: Artifact checksums (SHA-256)
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee checksums.txt
          sha256sum app/build/outputs/apk/release/*.apk | tee -a checksums.txt
          sha256sum app/build/outputs/bundle/release/*.aab | tee -a checksums.txt
          cat checksums.txt

      - name: Verify no secrets in tree
        run: |
          if grep -rnE "(sk-[A-Za-z0-9]{40,})|(ghp_[A-Za-z0-9]{36})|(AKIA[0-9A-Z]{16})" \
             --exclude-dir=.git --exclude-dir=build --exclude='*.gradle' \
             --exclude='HybridPipelineTest.kt' . ; then
            echo "FOUND_SECRETS" && exit 1
          fi
          echo "no secrets found"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: svetlana-home-release
          path: |
            app/build/outputs/apk/release/
            app/build/outputs/bundle/release/
            checksums.txt
          if-no-files-found: error

      - name: Report gate result
        run: |
          echo "PRODUCTION_GATE=PASSED"
          echo "NOTE: gate доказывает сборку и подпись, но НЕ заменяет физическое тестирование на устройстве."

  # ─── Publish GitHub Release ─────────────────────────────────────────
  # Тег и название берутся из versionName. Запуск: тег v* или коммит в main с сообщением "release".
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ build, production-gate ]
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Version
        id: v
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release v$VERSION"

      - name: Prepare release keystore
        env:
          SVETLANA_KEYSTORE_BASE64: ${{ secrets.SVETLANA_KEYSTORE_BASE64 }}
          SVETLANA_STORE_PASSWORD: ${{ secrets.SVETLANA_STORE_PASSWORD }}
          SVETLANA_KEY_ALIAS: ${{ secrets.SVETLANA_KEY_ALIAS }}
          SVETLANA_KEY_PASSWORD: ${{ secrets.SVETLANA_KEY_PASSWORD }}
        run: |
          if [ -z "$SVETLANA_KEYSTORE_BASE64" ] || [ -z "$SVETLANA_STORE_PASSWORD" ] || [ -z "$SVETLANA_KEY_ALIAS" ] || [ -z "$SVETLANA_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are incomplete. Publishing a release requires a signed APK."
            exit 1
          fi
          echo "$SVETLANA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/svetlana-release.jks"
          test -s "$RUNNER_TEMP/svetlana-release.jks"
          echo "SVETLANA_STORE_FILE=$RUNNER_TEMP/svetlana-release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_ENABLED=true" >> "$GITHUB_ENV"

      - name: Build signed release APK + AAB
        env:
          SVETLANA_STORE_FILE: ${{ env.SVETLANA_STORE_FILE }}
          SVETLANA_STORE_PASSWORD: ${{ secrets.SVETLANA_STORE_PASSWORD }}
          SVETLANA_KEY_ALIAS: ${{ secrets.SVETLANA_KEY_ALIAS }}
          SVETLANA_KEY_PASSWORD: ${{ secrets.SVETLANA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify release signature
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner не найден" && exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          cp "$APK" "release-assets/Svetlana-Home-arm64.apk"
          cp "$AAB" "release-assets/Svetlana-Home.aab"
          (cd release-assets && sha256sum *.apk *.aab > checksums.txt)
          cat release-assets/checksums.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Svetlana Home v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/Svetlana-Home-arm64.apk
            release-assets/Svetlana-Home.aab
            release-assets/checksums.txt
          fail_on_unmatched_files: true
