name: SvetlanaHome CI

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ─── Development gate ───────────────────────────────────────────
  # Мягкий: допусняет fallthrough, чтобы разработка не блокировалась.
  build:
    name: Dev gate — Lint + Unit + APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # На hosted-раннере Ubuntu Android SDK 36 и build-tools уже предустановлены.
      # android-actions/setup-android@v3 здесь не используется: он пытается установить
      # устаревший пакет tools, которого больше нет в cmdline-tools 16.0.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Gradle memory
        # lintAnalyzeDebug требует много heap на x86_64; без этого daemon
        # падает с JVM crash на hosted-раннере.
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Compute APK checksum
        id: checksum
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/apk.sha256
          echo "sha256=$(cut -d' ' -f1 < app/build/outputs/apk/debug/apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: svetlana-home-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/apk.sha256
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # ─── Instrumentation (emulator) ────────────────────────────────
  # Эмулятор НЕ заменяет тестирование на физическом устройстве (ТЗ §77).
  # Запускается как информация; для production-gate не учитывается.
  instrumentation:
    name: Instrumentation tests (emulator, info)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install emulator system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "system-images;android-30;default;x86_64" || true

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          # Даём эмулятору время на полную загрузку, иначе adb падает
          # с "device offline" на медленных раннерах.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb wait-for-device
            ./gradlew connectedDebugAndroidTest --no-daemon

  # ─── Production gate ──────────────────────────────────────────
  # Жёсткий: все шаги обязательны. Только этот джоб может разрешать
  # релиз (аудит п.2). continue-on-error здесь недопустим.
  production-gate:
    name: Production gate — full verification
    runs-on: ubuntu-latest
    needs: [ build ]
    # Защищаем от случайного игнорирования сбоев.
    # instrumentation намеренно не в needs: эмулятор — информационный шаг
    # и не должен блокировать gate (ТЗ §77: эмулятор ≠ физическое устройство).
    # Аудит п.5: gate обязан работать и на main, и на тегах v* — иначе
    # publish-release (который от нас зависит) никогда не запустится.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Gradle memory
        # lintAnalyzeDebug требует много heap на x86_64; без этого daemon
        # падает с JVM crash на hosted-раннере.
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Lint (strict)
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests (strict)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Debug APK (strict)
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare release keystore
        # ТЗ §78: keystore никогда не хранится в репозитории — он приходит
        # как base64 через GitHub Secrets. Если секрета нет, сборка остаётся
        # unsigned, и мы ЧЕСТНО отмечаем это в имени артефакта.
        env:
          SVETLANA_KEYSTORE_BASE64: ${{ secrets.SVETLANA_KEYSTORE_BASE64 }}
          SVETLANA_STORE_PASSWORD: ${{ secrets.SVETLANA_STORE_PASSWORD }}
          SVETLANA_KEY_ALIAS: ${{ secrets.SVETLANA_KEY_ALIAS }}
          SVETLANA_KEY_PASSWORD: ${{ secrets.SVETLANA_KEY_PASSWORD }}
        run: |
          if [ -n "$SVETLANA_KEYSTORE_BASE64" ]; then
            echo "$SVETLANA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/svetlana-release.jks"
            echo "SVETLANA_STORE_FILE=$RUNNER_TEMP/svetlana-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            echo "Release keystore prepared"
          else
            echo "SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning::Release keystore secret not set — release APK/AAB will be UNSIGNED"
          fi

      - name: Release APK with R8 (strict)
        # ТЗ §29: release-сборка с минификацией. Подпись подключается
        # через env из секрета на предыдущем шаге.
        env:
          SVETLANA_STORE_FILE: ${{ env.SVETLANA_STORE_FILE }}
          SVETLANA_STORE_PASSWORD: ${{ secrets.SVETLANA_STORE_PASSWORD }}
          SVETLANA_KEY_ALIAS: ${{ secrets.SVETLANA_KEY_ALIAS }}
          SVETLANA_KEY_PASSWORD: ${{ secrets.SVETLANA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Release AAB (strict)
        env:
          SVETLANA_STORE_FILE: ${{ env.SVETLANA_STORE_FILE }}
          SVETLANA_STORE_PASSWORD: ${{ secrets.SVETLANA_STORE_PASSWORD }}
          SVETLANA_KEY_ALIAS: ${{ secrets.SVETLANA_KEY_ALIAS }}
          SVETLANA_KEY_PASSWORD: ${{ secrets.SVETLANA_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify release signature
        # Аудит п.3: jarsigner -verify сообщает "unsigned" для APK, подписанных
        # по схеме v2/v3 (подпись лежит не в META-INF, а в блоке APK Signing
        # Block). Единственный правильный способ проверить APK — apksigner.
        # AAB подписывается jarsigner-совместимой схемой, поэтому для него
        # отдельная проверка jarsigner допустима.
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner не найден в build-tools" && exit 1
          fi
          echo "Using: $APKSIGNER"
          if [ "$SIGNING_ENABLED" = "true" ]; then
            # apksigner verify падает с ненулевым кодом, если подпись неверная.
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            echo "APK_SIGNATURE=SIGNED (apksigner)"
          else
            echo "APK_SIGNATURE=UNSIGNED (keystore secret not set)"
          fi
          if jarsigner -verify "$AAB" 2>/dev/null; then
            echo "AAB_SIGNATURE=SIGNED"
          else
            echo "AAB_SIGNATURE=UNSIGNED"
          fi

      - name: Check 16 KB native library alignment
        # Аудит п.22/п.4: настоящая проверка. p_align лежит в Elf64_Phdr
        # для PT_LOAD-сегментов, а не в смещении 0x20 (там e_phoff).
        # Парсим ELF-заголовок → таблицу program headers → PT_LOAD.p_align.
        # Лимитирующий фактор — МИНИМАЛЬНОЕ p_align среди сегментов.
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          TMP=$(mktemp -d)
          unzip -o -q "$APK" -d "$TMP" 'lib/*' || true
          python3 scripts/check_16kb_alignment.py "$TMP"

      - name: Artifact checksums (SHA-256)
        # ТЗ §32: каждый артефакт сопровождается контрольной суммой.
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee checksums.txt
          sha256sum app/build/outputs/apk/release/*.apk | tee -a checksums.txt
          sha256sum app/build/outputs/bundle/release/*.aab | tee -a checksums.txt
          cat checksums.txt

      - name: Verify no secrets in tree
        run: |
          # ТЗ §78: в репозитории не должно быть секретов.
          # Ловим реальные шаблоны ключей (длина, специфичная для провайдеров).
          # Тестовые строки в HybridPipelineTest намеренно содержат
          # маскируемый пример — это не секрет, а проверка санитизации.
          if grep -rnE "(sk-[A-Za-z0-9]{40,})|(ghp_[A-Za-z0-9]{36})|(AKIA[0-9A-Z]{16})" \
             --exclude-dir=.git --exclude-dir=build --exclude='*.gradle' \
             --exclude='HybridPipelineTest.kt' . ; then
            echo "FOUND_SECRETS" && exit 1
          fi
          echo "no secrets found"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: svetlana-home-release
          path: |
            app/build/outputs/apk/release/
            app/build/outputs/bundle/release/
            checksums.txt
          if-no-files-found: error

      - name: Report gate result
        run: echo "PRODUCTION_GATE=PASSED"

  # ─── Publish GitHub Release ─────────────────────────────────────
  # Публикует подписанный release APK + AAB + checksums в GitHub Releases,
  # чтобы любой пользователь мог скачать их прямо на Android-устройство.
  # Запускается только при push тега v* и только если production gate прошёл.
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ build, production-gate ]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare release keystore
        env:
          SVETLANA_KEYSTORE_BASE64: ${{ secrets.SVETLANA_KEYSTORE_BASE64 }}
          SVETLANA_STORE_PASSWORD: ${{ secrets.SVETLANA_STORE_PASSWORD }}
          SVETLANA_KEY_ALIAS: ${{ secrets.SVETLANA_KEY_ALIAS }}
          SVETLANA_KEY_PASSWORD: ${{ secrets.SVETLANA_KEY_PASSWORD }}
        run: |
          if [ -n "$SVETLANA_KEYSTORE_BASE64" ]; then
            echo "$SVETLANA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/svetlana-release.jks"
            echo "SVETLANA_STORE_FILE=$RUNNER_TEMP/svetlana-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning::Release keystore secret not set — APK will be UNSIGNED"
          fi

      - name: Build signed release APK + AAB
        env:
          SVETLANA_STORE_FILE: ${{ env.SVETLANA_STORE_FILE }}
          SVETLANA_STORE_PASSWORD: ${{ secrets.SVETLANA_STORE_PASSWORD }}
          SVETLANA_KEY_ALIAS: ${{ secrets.SVETLANA_KEY_ALIAS }}
          SVETLANA_KEY_PASSWORD: ${{ secrets.SVETLANA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify release signature
        # Аудит п.3: jarsigner не видит v2/v3-подписи APK — нужен apksigner.
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner не найден" && exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK_SIGNATURE=SIGNED (apksigner)"

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          cp "$APK" "release-assets/Svetlana-Home-${GITHUB_REF_NAME}-arm64.apk"
          cp "$AAB" "release-assets/Svetlana-Home-${GITHUB_REF_NAME}.aab"
          (cd release-assets && sha256sum *.apk *.aab > checksums.txt)
          cat release-assets/checksums.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Svetlana Home ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/Svetlana-Home-${{ github.ref_name }}-arm64.apk
            release-assets/Svetlana-Home-${{ github.ref_name }}.aab
            release-assets/checksums.txt
          fail_on_unmatched_files: true
